spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:cepdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always

app.auth.code.expire-minutes=10
app.auth.code.resend-seconds=1
app.auth.token.access-expire-minutes=15
app.auth.token.refresh-expire-days=7
app.auth.mail.subject=测试验证码
app.auth.mail.from=test@example.com

spring.mail.host=localhost
spring.mail.port=25

